[project]
name = "ofm-webcam-gui"
version = "0.1.0"
description = "PyQt5 + OpenCV webcam viewer with optional precision-stage control"
requires-python = ">=3.11"
dependencies = [
    "PyQt5>=5.15.0",
    "opencv-python-headless>=4.5.0",
    "numpy>=1.19.0",
    "pyserial>=3.5",
    "sangaboard>=0.1.0",
    "pygrabber>=0.1.0; sys_platform == 'win32'",  # Windows-only camera names
]

[project.scripts]
ofm-webcam-gui = "app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
packages = ["core", "hardware", "hardware.stage", "ui", "ui.panels", "ui.threads"]
